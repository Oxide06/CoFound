<style>
        body {
            background-color: #0B0E14;
            color: #e7e0ed;
            font-family: 'Geist', sans-serif;
        }
        
        .font-geist {
            font-family: 'Geist', sans-serif;
        }

        .glass-panel {
            background: rgba(33, 30, 39, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(208, 188, 255, 0.1);
        }

        .input-glass {
            background: rgba(15, 13, 21, 0.6);
            border: 1px solid rgba(149, 142, 160, 0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-glass:focus {
            border-color: #d0bcff;
            background: rgba(208, 188, 255, 0.05);
            box-shadow: 0 0 0 1px rgba(208, 188, 255, 0.2);
            outline: none;
        }

        .btn-premium {
            background: #a078ff;
            color: #23005c;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-premium:hover {
            box-shadow: 0 4px 16px rgba(160, 120, 255, 0.3);
            filter: brightness(1.1);
        }

        .role-chip {
            background: rgba(55, 51, 61, 0.4);
            border: 1px solid rgba(149, 142, 160, 0.1);
            transition: all 0.2s ease;
        }

        .role-chip:hover {
            background: rgba(55, 51, 61, 0.6);
            border-color: rgba(149, 142, 160, 0.3);
        }

        .peer:checked + .role-chip {
            border-color: #d0bcff;
            background: rgba(160, 120, 255, 0.15);
            color: #d0bcff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary/30" style="background-color: #15121b;">
<header class="w-full py-6 px-margin-mobile md:px-margin-desktop flex justify-between items-center absolute top-0 z-50">
<a class="text-headline-md font-bold text-primary flex items-center gap-2 group transition-all" href="/">
<span class="material-symbols-outlined text-[28px] transition-transform group-hover:rotate-12" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<span class="tracking-tight">CoFound</span>
</a>
<a href="/logout" class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-medium text-body-md group">
  <span class="material-symbols-outlined text-[20px]">logout</span>
  <span class="">Logout</span>
</a></header>
<main class="flex-grow flex items-center justify-center py-20 px-margin-mobile md:px-gutter relative overflow-hidden" style="background-image: linear-gradient(rgba(11, 14, 20, 0.8), rgba(11, 14, 20, 0.8)), url('https://lh3.googleusercontent.com/aida-public/AB6AXuDuZu82QYkfjI8bSIb4Z0VhHsQ0pzOius6CSydF9vQaRJYzer41k7_LSH1taSpSGIq4S0UwKCaK_SkT1LD632zvJQQ72nD824iag-tJthaWfZS-NjHcIqhhr83TvDn7o-GEX2nuT7GP11z949CV6iY7uSW8PuSbUozVNdTseNGANQMCjyWG6fFsWqFtApzXHJWGz-v8_Wi_uBkeZqIhjTF2lhZUylLWvh13EywYyX5I0yno9czpgtBSWZ_GanSS13I7KubwCRorXnk'); background-size: cover; background-position: center;">
<!-- Sophisticated Background Accents -->
<div class="w-full max-w-2xl mt-8">
<!-- Registration Card -->
<div class="glass-panel rounded-xl p-8 md:p-12 shadow-2xl relative z-10" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(16, 185, 129, 0.15) 100%); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1);">
<div class="mb-10 text-center">
<h1 class="text-headline-lg-mobile md:text-headline-lg text-on-surface mb-3 tracking-tight">Join CoFound</h1>
<p class="text-body-lg text-on-surface-variant font-light">Connect with founders, developers, and visionaries.</p>
</div>
<form class="space-y-8">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center space-y-4 p-8 border border-dashed border-outline-variant rounded-xl hover:border-primary/40 hover:bg-surface-container-low transition-all cursor-pointer group">
<div class="w-20 h-20 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:bg-primary/10 transition-all shadow-inner border border-outline-variant/30">
<span class="material-symbols-outlined text-outline text-3xl group-hover:text-primary transition-colors">add_a_photo</span>
</div>
<div class="text-center">
<p class="text-body-md font-medium text-on-surface">Upload Profile Photo</p>
<p class="text-label-md text-outline mt-1 font-medium">Powered by Cloudinary. JPG, PNG (Max 5MB)</p>
</div>
<input accept="image/*" class="hidden" type="file">
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="text-label-md uppercase tracking-widest text-outline" for="fullName">Full Name</label>
<input class="w-full input-glass rounded-lg px-4 py-3 text-on-surface placeholder-outline-variant" id="fullName" placeholder="Jane Doe" required="" type="text">
</div>
<!-- Email -->
<div class="space-y-2">
<label class="text-label-md uppercase tracking-widest text-outline" for="email">Email</label>
<input class="w-full input-glass rounded-lg px-4 py-3 text-on-surface placeholder-outline-variant" id="email" placeholder="jane@example.com" required="" type="email">
</div>
<!-- Password -->
<div class="space-y-2">
<label class="text-label-md uppercase tracking-widest text-outline" for="password">Password</label>
<div class="relative">
<input class="w-full input-glass rounded-lg px-4 py-3 text-on-surface placeholder-outline-variant pr-12" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface p-2 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-2">
<label class="text-label-md uppercase tracking-widest text-outline" for="confirmPassword">Confirm Password</label>
<input class="w-full input-glass rounded-lg px-4 py-3 text-on-surface placeholder-outline-variant" id="confirmPassword" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Role Selection -->
<div class="space-y-4">
<label class="text-label-md uppercase tracking-widest text-outline">Primary Role</label>
<div class="grid grid-cols-2 md:grid-cols-3 gap-3">
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="Founder">
<div class="role-chip px-4 py-3 rounded-lg text-center text-body-md font-medium text-on-surface-variant transition-all">
                                Founder
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="Developer">
<div class="role-chip px-4 py-3 rounded-lg text-center text-body-md font-medium text-on-surface-variant transition-all">
                                Developer
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="Designer">
<div class="role-chip px-4 py-3 rounded-lg text-center text-body-md font-medium text-on-surface-variant transition-all">
                                Designer
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="Business">
<div class="role-chip px-4 py-3 rounded-lg text-center text-body-md font-medium text-on-surface-variant transition-all">
                                Business
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="role" type="radio" value="Marketing">
<div class="role-chip px-4 py-3 rounded-lg text-center text-body-md font-medium text-on-surface-variant transition-all">
                                Marketing
                            </div>
</label>
</div>
</div>
<!-- Actions -->
<div class="pt-6 space-y-6">
<button class="w-full btn-premium py-4 px-8 rounded-lg font-semibold text-body-md flex justify-center items-center gap-2 group" type="submit">
                        Join CoFound
                        <span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<div class="text-center">
<p class="text-body-md text-on-surface-variant">
                            Already have an account? 
                            <a class="text-primary hover:text-primary-fixed transition-all font-medium underline decoration-primary/30 underline-offset-4 decoration-1 hover:decoration-solid" href="/login">Log in</a>
</p>
</div>
</div>
</form>
</div>
</div>
</main>
<footer class="w-full py-8 text-center text-outline text-label-md opacity-50 select-none">
    © 2024 CoFound Platform. All rights reserved.
</footer>


</body></html>
