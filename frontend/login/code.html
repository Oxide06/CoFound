<!-- Main Content -->
<nav class="glass-panel sticky top-0 z-50 border-b border-white/5">
  <div class="flex justify-between items-center w-full py-4 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">

      </button>
    </div>
  </div>
</nav><main class="flex-grow flex items-center justify-center px-margin-mobile md:px-gutter py-24 relative overflow-hidden">

<div class="glass-panel rounded-xl p-8 md:p-12 w-full max-w-md relative z-10 transition-all duration-500 hover:border-white/20">
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-gradient mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue to CoFound</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0; font-size: 20px;">mail</span>
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder-outline-variant/50 input-glow transition-all" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0; font-size: 20px;">lock</span>
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder-outline-variant/50 input-glow transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full premium-gradient text-white font-headline-md text-headline-md py-4 rounded-lg premium-gradient-hover transition-all duration-300 flex justify-center items-center gap-2 mt-8 shadow-lg shadow-primary/10" type="submit">
<span class="">Login</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="mt-10 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary hover:text-primary-fixed font-semibold ml-1 transition-colors" href="/register">Register</a>
</p>
